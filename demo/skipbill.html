<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cloud Shape</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<canvas id="canvas" style="width: 900px; height: 720px;"></canvas>
</body>
</html>
<script src="./paint-shapes.js" type="application/javascript"></script>
<script>

  var scale = window.devicePixelRatio || 1;
  var canvas = document.getElementById('canvas');
  canvas.width = `${900 * scale}`;
  canvas.height = `${720 * scale}`;
  var ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);

  var selectedShape = null;
  var selectedOffset = null;
  var isDragging = false;
  var playground = new FlatPlayground(ctx, 900 * scale, 600 * scale);

  // 用 DOT 语法描述图。cloud/cylinder 与 circle 一样用 center point 定位（x/y 为圆心/中心）
  var dot = `
digraph clouds {
  rect1 [label="最终账单金额小于1", shape=rectangle, x=330, y=60, z=0, w=240, h=60, color="#38bdf8", fillcolor="#38bdf866"];
  rect2 [label="住宅最终账单小于0.1", shape=rectangle, x=330, y=150, z=0, w=240, h=60, color="#34d399", fillcolor="#34d39966"];
  rect3 [label="判断是否是ebill", shape=rectangle, x=330, y=240, z=0, w=240, h=60, color="#a78bfa", fillcolor="#a78bfa66"];
  rect4 [label="账户属性判断", shape=rectangle, x=330, y=330, z=0, w=240, h=60, color="#fbbf24", fillcolor="#fbbf2466"];
  rect5 [label="异常SD，停止日期大于账单日期", shape=rectangle, x=330, y=420, z=0, w=240, h=60, color="#fb7185", fillcolor="#fb718566"];
  rect6 [label="LCM消息检测，有则N", shape=rectangle, x=330, y=510, z=0, w=240, h=60, color="#f97316", fillcolor="#f9731666"];
  rect7 [label="ADJ支付检测", shape=rectangle, x=330, y=600, z=0, w=240, h=60, color="#22d3ee", fillcolor="#22d3ee66"];

  // 顺序连线
  rect1 -> rect2 -> rect3 -> rect4 -> rect5 -> rect6 -> rect7;
}
`;

  var graph = Dot.parse(dot);
  for (let shape of graph.shapes) {
    playground.addShape(shape);
  }
  for (let edge of graph.edges) {
    playground.connect(edge.from, edge.to);
  }

  // 光束流动效果
  var beamEnabled = true;
  if (beamEnabled) {
    for (let conn of playground.getConnections()) {
      conn.beam = true;
    }
    playground.startBeamAnimation();
  }

  canvas.addEventListener('mousedown', ev => {
    const p = new Point(ev.layerX, ev.layerY);
    selectedShape = playground.select(ev.layerX, ev.layerY);
    if (selectedShape == null) {
      return;
    }
    selectedOffset = selectedShape.offset(p);
    isDragging = true;
  });

  canvas.addEventListener('mouseup', ev => {
    isDragging = false;
  });

  canvas.addEventListener('mousemove', ev => {
    if (!isDragging || selectedShape == null) {
      return;
    }
    ev.stopPropagation();
    const p = new Point(ev.layerX, ev.layerY);
    playground.shiftShape(selectedShape, p, selectedOffset);
  });

  document.body.addEventListener('mousemove', ev => {
    isDragging = false;
  });
</script>
