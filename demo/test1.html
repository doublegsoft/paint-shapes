<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test 1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<canvas id="canvas" style="width: 800px; height: 600px;"></canvas>
<button id="buttonSave">保存</button>
</body>
</html>
<script src="./paint-shapes.js" type="application/javascript"></script>
<script>

var scale = window.devicePixelRatio || 1;
var canvas = document.getElementById('canvas');
canvas.width = `${800 * scale}`;
canvas.height = `${600 * scale}`;
var ctx = canvas.getContext("2d");
ctx.scale(scale, scale);

var selectedShape = null;
var selectedOffset = null;
var isDragging = false;
var playground = new FlatPlayground(ctx, 800 * scale, 600 * scale);

var start = new Circle(new Point(125, 100), 25);
start.id = 'circle';
start.text = '开始';
start.backgroundColor = Color.from('#fb718566');
start.borderColor = Color.from('#fb7185');
start.borderWidth = 2;
start.foregroundColor = new Color(255, 255, 255);
playground.addShape(start);

var square = new Square(new Point(100, 200), 50);
square.id = 'square';
square.text = '远程调用';
square.borderRadius = 10;
square.backgroundColor = Color.from('#22d3ee66');
square.borderColor = Color.from('#22d3ee');
square.borderWidth = 2;
square.foregroundColor = new Color(255, 255, 255);
playground.addShape(square);

var diamond = new Diamond(new Point(300, 225), 100, 50);
diamond.id = 'diamond';
diamond.text = 'Are you OK?';
diamond.backgroundColor = Color.from('#34d39966');
diamond.borderColor = Color.from('#34d399');
diamond.borderWidth = 2;
diamond.foregroundColor = new Color(255, 255, 255);
playground.addShape(diamond);

var rectangle = new Rectangle(new Point(250, 350), 100, 50);
rectangle.id = 'rectangle';
rectangle.text = 'This is a rectangle!';
rectangle.borderRadius = 10;
rectangle.backgroundColor = Color.from('#a78bfa66');
rectangle.borderColor = Color.from('#a78bfa');
rectangle.borderWidth = 2;
rectangle.foregroundColor = new Color(255, 255, 255);
playground.addShape(rectangle);

var rect1 = new Rectangle(new Point(450, 200), 100, 50);
rect1.id = 'rect1';
rect1.text = 'This is rect!';
rect1.borderRadius = 10;
rect1.backgroundColor = Color.from('#f9731666');
rect1.borderColor = Color.from('#f97316');
rect1.borderWidth = 2;
rect1.foregroundColor = new Color(255, 255, 255);
playground.addShape(rect1);

var end = new Circle(new Point(500, 375), 25);
end.id = 'circle';
end.text = '结束';
end.backgroundColor = Color.from('#fb718566');
end.borderColor = Color.from('#fb7185');
end.borderWidth = 2;
end.foregroundColor = new Color(255, 255, 255);
playground.addShape(end);

playground.connect(start, square);
playground.connect(square, diamond);
playground.connect(diamond, rect1);
playground.connect(diamond, rectangle);
playground.connect(rect1, end);
playground.connect(rectangle, end);

// playground.drawQuadraticCurveWithArrow(new Point(50, 50), new Point(200, 200), 50);

canvas.addEventListener('mousedown', ev => {
  const p = new Point(ev.layerX, ev.layerY);
  selectedShape = playground.select(ev.layerX, ev.layerY);
  if (selectedShape == null) {
    return;
  }
  selectedOffset = selectedShape.offset(p);
  isDragging = true;
});

canvas.addEventListener('mouseup', ev => {
  isDragging = false;
});

canvas.addEventListener('mousemove', ev => {
  if (!isDragging || selectedShape == null) {
    return;
  }
  ev.stopPropagation();
  const p = new Point(ev.layerX, ev.layerY);
  playground.shiftShape(selectedShape, p, selectedOffset);
});

document.body.addEventListener('mousemove', ev => {
  isDragging = false;
});

var buttonSave = document.getElementById('buttonSave');
buttonSave.addEventListener('click', ev => {
  for (let shape of playground.getShapes()) {
    console.log(shape);
  }
  for (let conn of playground.getConnections()) {
    console.log(conn);
  }
});
</script>
