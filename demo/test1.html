<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test 1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<canvas id="canvas" style="width: 800px; height: 600px;"></canvas>
<button id="buttonSave">保存</button>
</body>
</html>
<script src="./paint-shapes.js" type="application/javascript"></script>
<script>

var scale = window.devicePixelRatio || 1;
var canvas = document.getElementById('canvas');
canvas.width = `${800 * scale}`;
canvas.height = `${600 * scale}`;
var ctx = canvas.getContext("2d");
ctx.scale(scale, scale);

var selectedShape = null;
var selectedOffset = null;
var isDragging = false;
var playground = new FlatPlayground(ctx, 800 * scale, 600 * scale);

// 用 DOT 语法描述图，节点坐标通过自定义属性 x/y/z 指定（不做自动布局）
var dot = `
digraph flow {
  start     [label="开始", shape=circle, x=125, y=100, z=0, r=25, color="#fb7185", fillcolor="#fb718566"];
  square    [label="远程调用", shape=square, x=100, y=200, z=0, w=50, color="#22d3ee", fillcolor="#22d3ee66"];
  diamond   [label="Are you OK?", shape=diamond, x=300, y=225, z=0, w=100, h=50, group="示例分组", color="#34d399", fillcolor="#34d39966"];
  rectangle [label="This is a rectangle!", shape=box, x=250, y=350, z=0, w=100, h=50, group="示例分组", color="#a78bfa", fillcolor="#a78bfa66"];
  rect1     [label="This is rect!", shape=box, x=450, y=200, z=0, w=100, h=50, color="#f97316", fillcolor="#f9731666"];
  end       [label="结束", shape=circle, x=500, y=375, z=0, r=25, color="#fb7185", fillcolor="#fb718566"];

  start -> square;
  square -> diamond;
  diamond -> rect1;
  diamond -> rectangle;
  rect1 -> end;
  rectangle -> end;
}
`;

var graph = Dot.parse(dot);
for (let shape of graph.shapes) {
  playground.addShape(shape);
}
for (let edge of graph.edges) {
  playground.connect(edge.from, edge.to);
}

// 光束效果开关：改成 false 即关闭流动光束
var beamEnabled = true;
if (beamEnabled) {
  for (let conn of playground.getConnections()) {
    conn.beam = true;
  }
  playground.startBeamAnimation();
}

// playground.drawQuadraticCurveWithArrow(new Point(50, 50), new Point(200, 200), 50);

canvas.addEventListener('mousedown', ev => {
  const p = new Point(ev.layerX, ev.layerY);
  selectedShape = playground.select(ev.layerX, ev.layerY);
  if (selectedShape == null) {
    return;
  }
  selectedOffset = selectedShape.offset(p);
  isDragging = true;
});

canvas.addEventListener('mouseup', ev => {
  isDragging = false;
});

canvas.addEventListener('mousemove', ev => {
  if (!isDragging || selectedShape == null) {
    return;
  }
  ev.stopPropagation();
  const p = new Point(ev.layerX, ev.layerY);
  playground.shiftShape(selectedShape, p, selectedOffset);
});

document.body.addEventListener('mousemove', ev => {
  isDragging = false;
});

var buttonSave = document.getElementById('buttonSave');
buttonSave.addEventListener('click', ev => {
  for (let shape of playground.getShapes()) {
    console.log(shape);
  }
  for (let conn of playground.getConnections()) {
    console.log(conn);
  }
});
</script>
