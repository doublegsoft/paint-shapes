<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cloud Shape</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<canvas id="canvas" style="width: 900px; height: 600px;"></canvas>
</body>
</html>
<script src="./paint-shapes.js" type="application/javascript"></script>
<script>

var scale = window.devicePixelRatio || 1;
var canvas = document.getElementById('canvas');
canvas.width = `${900 * scale}`;
canvas.height = `${600 * scale}`;
var ctx = canvas.getContext("2d");
ctx.scale(scale, scale);

var selectedShape = null;
var selectedOffset = null;
var isDragging = false;
var playground = new FlatPlayground(ctx, 900 * scale, 600 * scale);

// 用 DOT 语法描述图。cloud/cylinder 与 circle 一样用 center point 定位（x/y 为圆心/中心）
var dot = `
digraph clouds {
  // Layer 1: Core Cloud Services (y = 150)
  cloud1 [label="私有云", shape=cloud, x=200, y=150, z=0, w=160, h=70, color="#38bdf8", fillcolor="#38bdf866"];
  cloud2 [label="公有云", shape=cloud, x=450, y=150, z=0, w=140, h=60, color="#34d399", fillcolor="#34d39966"];
  cloud3 [label="混合云", shape=cloud, x=700, y=150, z=0, w=150, h=80, color="#a78bfa", fillcolor="#a78bfa66"];

  // Layer 2: Intermediate Processing & Local DB (y = 330)
  db1    [label="数据库", shape=cylinder, x=200, y=330, z=0, w=120, h=60, color="#fbbf24", fillcolor="#fbbf2466"];
  cloud5 [label="雾计算", shape=cloud, x=450, y=330, z=0, w=120, h=50, color="#fb7185", fillcolor="#fb718566"];
  cloud4 [label="边缘云", shape=cloud, x=700, y=330, z=0, w=200, h=90, color="#f97316", fillcolor="#f9731666"];

  // Layer 3: Centralized Data Warehouse (y = 510)
  db2    [label="数据仓库", shape=cylinder, x=325, y=510, z=0, w=130, h=65, color="#22d3ee", fillcolor="#22d3ee66"];

  // Edges
  cloud1 -> cloud2;
  cloud2 -> cloud3;
  cloud3 -> cloud4;
  cloud4 -> cloud5;
  cloud1 -> db1;
  db1 -> db2;
  cloud5 -> db2;
}
`;

var graph = Dot.parse(dot);
for (let shape of graph.shapes) {
  playground.addShape(shape);
}
for (let edge of graph.edges) {
  playground.connect(edge.from, edge.to);
}

// 光束流动效果
var beamEnabled = true;
if (beamEnabled) {
  for (let conn of playground.getConnections()) {
    conn.beam = true;
  }
  playground.startBeamAnimation();
}

canvas.addEventListener('mousedown', ev => {
  const p = new Point(ev.layerX, ev.layerY);
  selectedShape = playground.select(ev.layerX, ev.layerY);
  if (selectedShape == null) {
    return;
  }
  selectedOffset = selectedShape.offset(p);
  isDragging = true;
});

canvas.addEventListener('mouseup', ev => {
  isDragging = false;
});

canvas.addEventListener('mousemove', ev => {
  if (!isDragging || selectedShape == null) {
    return;
  }
  ev.stopPropagation();
  const p = new Point(ev.layerX, ev.layerY);
  playground.shiftShape(selectedShape, p, selectedOffset);
});

document.body.addEventListener('mousemove', ev => {
  isDragging = false;
});
</script>
